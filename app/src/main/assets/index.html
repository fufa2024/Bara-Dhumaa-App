<!DOCTYPE html>
<html lang="om"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afaan Oromoo Bible Study</title>
<style>
:root{--bg:#faf7ff;--fg:#1f1b24;--card:#fff;--pri:#4a148c;--acc:#ffb300;--mut:#6b6475;--bd:#e4dcf0}
body.dark{--bg:#14101a;--fg:#ece6f4;--card:#1e1826;--pri:#b388ff;--acc:#ffca28;--mut:#a79db5;--bd:#2f2640}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.65}
header{position:sticky;top:0;background:var(--pri);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:5}
body.dark header{color:#14101a}
header h1{font-size:17px;margin:0;flex:1}
header button{background:none;border:0;color:inherit;font-size:19px;padding:4px 7px}
main{padding:14px;max-width:760px;margin:auto}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--acc);border-radius:10px;padding:12px 14px;margin:10px 0;color:var(--fg);text-decoration:none}
.card small{color:var(--mut)}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.book{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;color:var(--fg);text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.book img{width:100%;display:block}
.book .bt{padding:8px 10px;font-size:.85em;line-height:1.35}.book small{color:var(--mut)}
.nocover{background:linear-gradient(135deg,#4a148c,#1a0536);color:#ffca28;padding:50px 10px;text-align:center;font-size:18px;font-weight:700;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
input[type=search]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:16px}
h2{color:var(--pri);margin-top:6px}h3{color:var(--pri);margin:18px 0 4px}
ul{padding-left:20px}li{margin:4px 0}
.ref{color:var(--mut);font-size:.9em}
.nav{display:flex;justify-content:space-between;margin:24px 0}
.nav a{color:var(--pri);font-weight:600;text-decoration:none}
.bm{float:right;font-size:26px;background:none;border:0;color:var(--acc)}
.pg{width:100%;border:1px solid var(--bd);border-radius:6px;margin:8px 0;background:#fff;display:block}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.93);overflow:auto;z-index:50;-webkit-overflow-scrolling:touch}
#zm img{width:230%;max-width:none;display:block}
#zx{position:fixed;top:10px;right:14px;z-index:60;background:#ffb300;color:#000;border:0;border-radius:20px;font-size:18px;padding:6px 14px}
.cred{text-align:center;padding:14px 0;color:var(--mut);font-size:.9em}
.cover img{width:72%;max-width:340px;margin:0 auto 10px;border-radius:12px;display:block;box-shadow:0 3px 12px rgba(0,0,0,.25)}
a{color:var(--pri)}
</style></head><body>
<header><button id="back" onclick="history.back()" style="display:none">&#8592;</button><h1 id="ttl">Afaan Oromoo Bible Study</h1>
<button onclick="location.hash='#search'">&#128269;</button><button onclick="location.hash='#marks'">&#9733;</button>
<button onclick="fs(1)">A+</button><button onclick="fs(-1)">A&#8722;</button><button onclick="dm()">&#9680;</button></header>
<main id="app"></main>
<script>var BOOKS=[];</script>
<script src="book1.js"></script><script src="book2.js"></script><script src="book3.js"></script><script src="book4.js"></script>
<script src="book5.js"></script><script src="book6.js"></script><script src="book7.js"></script><script src="book8.js"></script>
<script src="book9.js"></script><script src="book10.js"></script><script src="book11.js"></script><script src="book12.js"></script>
<script>
var S={};try{S=JSON.parse(localStorage.getItem('bd2')||'{}')}catch(e){}
S.marks=S.marks||[];S.size=S.size||17;S.dark=!!S.dark;
function save(){try{localStorage.setItem('bd2',JSON.stringify(S))}catch(e){}}
function apply(){document.body.className=S.dark?'dark':'';document.body.style.fontSize=S.size+'px'}
function fs(d){S.size=Math.min(28,Math.max(13,S.size+d*2));save();apply()}
function dm(){S.dark=!S.dark;save();apply()}
function strip(h){return h.replace(/<[^>]+>/g,' ')}
BOOKS.forEach(function(b){var a=(b.author||'').replace("Qophaa'ina:",'Kan Qopheesse:');if(!/^Kan Qopheesse/.test(a))a='Kan Qopheesse: '+a;b.author=a});
function getBook(id){return BOOKS.find(function(b){return b.id===id})}
function home(){
 var h='<h2>Afaan Oromoo Bible Study</h2><p class="ref">Kitaabilee Qo\'annoo Macaafa Qulqulluu</p>';
 if(!BOOKS.length)h+='<p>Kitaabni hin jiru.</p>';
 h+='<div class="shelf">';
 BOOKS.forEach(function(b){
  h+='<a class="book" href="#b/'+b.id+'">'+(b.cover?'<img alt="" src="'+b.cover+'">':'<div class="nocover">'+b.title+'</div>')+
  '<div class="bt"><b>'+b.title+'</b><br><small>'+(b.sub||'')+' · '+b.chapters.length+' kutaa</small></div></a>'});
 h+='</div>';
 h+='<a class="card" href="#about"><b>Waa\'ee Barreessaa</b><br><small>About the Author · Fufa Basha Hordofa</small></a>';
 h+='<a class="card" href="#credits"><b>Waa\'ee Appii</b><br><small>About the App</small></a>';
 return h}
function bookPage(id){var b=getBook(id);if(!b)return home();
 var h=(b.cover?'<div class="cover"><img alt="" src="'+b.cover+'"></div>':'')+'<h2>'+b.title+'</h2><p class="ref">'+(b.author||'')+'</p>';
 b.chapters.forEach(function(c){h+='<a class="card" href="#b/'+id+'/'+c.id+'"><b>'+c.title+'</b><br><small>'+(c.sub||'')+'</small></a>'});
 return h}
function chap(bid,cid){var b=getBook(bid);if(!b)return home();
 var i=b.chapters.findIndex(function(c){return c.id===cid});if(i<0)return bookPage(bid);
 var c=b.chapters[i],key=bid+'/'+cid,on=S.marks.indexOf(key)>=0;
 return '<button class="bm" onclick="mk(\''+key+'\')">'+(on?'&#9733;':'&#9734;')+'</button><h2>'+c.title+'</h2>'+c.html+
 '<div class="nav"><span>'+(i>0?'<a href="#b/'+bid+'/'+b.chapters[i-1].id+'">&#8592; Duraa</a>':'')+'</span><span>'+
 (i<b.chapters.length-1?'<a href="#b/'+bid+'/'+b.chapters[i+1].id+'">Itti aanu &#8594;</a>':'')+'</span></div>'}
function mk(key){var k=S.marks.indexOf(key);if(k>=0)S.marks.splice(k,1);else S.marks.push(key);save();route()}
function marks(){var h='<h2>&#9733; Mallattoo (Bookmarks)</h2>',n=0;
 S.marks.forEach(function(key){var p=key.split('/'),b=getBook(p[0]);if(!b)return;
  var c=b.chapters.find(function(x){return x.id===p[1]});if(c){n++;h+='<a class="card" href="#b/'+key+'"><b>'+c.title+'</b><br><small>'+b.title+'</small></a>'}});
 if(!n)h+='<p>Mallattoon hin jiru. &#9734; tuqi.</p>';return h}
function zoom(src){var d=document.createElement('div');d.id='zm';d.innerHTML='<img src="'+src+'">';var x=document.createElement('button');x.id='zx';x.textContent='\u2715 Cufi';x.onclick=function(){d.remove();x.remove()};document.body.appendChild(d);document.body.appendChild(x)}
function search(){return '<h2>Barbaadi</h2><input type="search" id="q" placeholder="Jecha barbaadi..." oninput="doSearch(this.value)"><div id="res"></div>'}
function doSearch(q){q=q.trim().toLowerCase();var r=document.getElementById('res'),h='',n=0;
 if(q.length<2){r.innerHTML='';return}
 BOOKS.forEach(function(b){b.chapters.forEach(function(c){if(n>40||c.skip)return;var t=strip(c.html),p=t.toLowerCase().indexOf(q);
  if(p>=0||c.title.toLowerCase().indexOf(q)>=0){n++;var s=t.substring(Math.max(0,p-40),p+90);
   h+='<a class="card" href="#b/'+b.id+'/'+c.id+'"><b>'+c.title+'</b><br><small>'+b.title+' · &hellip;'+s+'&hellip;</small></a>'}})});
 r.innerHTML=h||'<p>Homaa hin argamne.</p>'}
function about(){return '<h2>Waa\'ee Barreessaa</h2><p class="ref">About the Author</p>'+
 '<p><b>Fufa Basha Hordofa</b></p>'+
 '<h3>Personal Information</h3><ul><li><b>Full Name:</b> Fufa Basha Hordofa</li><li><b>Phone:</b> <a href="tel:0922202240">0922202240</a></li><li><b>Email:</b> <a href="mailto:fufabasha@gmail.com">fufabasha@gmail.com</a></li><li><b>Location:</b> Finfinnee, Oromiyaa, Ethiopia</li></ul>'+
 '<h3>Educational Background</h3><ol><li>Master of Science (MSc) in Policy Analysis – Ethiopian Public Service University (2026).</li><li>Bachelor of Science (BSc) in Statistics – Mekelle University.</li></ol>'+
 '<h3>Christian Ministry and Experience</h3>'+
 '<p>Fufa Basha Hordofa is a Christian theologian with more than 15 years of experience in preaching the Gospel of Jesus Christ, Christian teaching, and gospel singing.</p>'+
 '<p>Throughout his Christian ministry, he has devoted himself to sharing the Word of God, proclaiming the message of salvation through Jesus Christ, encouraging spiritual growth, and helping people develop a deeper understanding of biblical teachings.</p>'+
 '<p>His ministry focuses on biblical truth, faith, salvation, Christian living, and the hope of eternal life.</p>'+
 '<h3>About This Book</h3>'+
 '<p><i>Barumsa Bara Dhumaa (Eschatology) – 2026</i> is a Christian educational resource designed to explore biblical teachings about the last days and the future according to the Holy Scriptures.</p>'+
 '<p>The study addresses important theological subjects, including:</p>'+
 '<ul><li>Biblical prophecy and the signs of the last days.</li><li>The second coming of Jesus Christ.</li><li>The resurrection of the dead.</li><li>The final judgment.</li><li>The Kingdom of God and eternal life.</li><li>The new heaven and the new earth.</li></ul>'+
 '<p>The purpose of this work is to promote biblical understanding, strengthen Christian faith, and encourage believers to study the Word of God carefully.</p>'+
 '<h3>Connect with the Author</h3><ul>'+
 '<li><b>Facebook:</b> <a href="https://web.facebook.com/fufa.basha.hordofa/">facebook.com/fufa.basha.hordofa</a></li>'+
 '<li><b>YouTube:</b> <a href="https://www.youtube.com/@FufaBashaH">youtube.com/@FufaBashaH</a></li>'+
 '<li><b>Email:</b> <a href="mailto:fufabasha@gmail.com">fufabasha@gmail.com</a></li>'+
 '<li><b>Phone:</b> <a href="tel:0922202240">0922202240</a></li></ul>'+
 '<p><b>Prepared and presented by:</b><br>Fufa Basha Hordofa<br>Finfinnee, Oromiyaa, Ethiopia<br>2026</p>'}
function credits(){var h='<h2>Waa\'ee Appii</h2><p><b>Afaan Oromoo Bible Study</b></p><p>Appii kun kitaabilee qo\'annoo Macaafa Qulqulluu Afaan Oromootiin qophaa\'an walitti qaba.</p>'+
 '<p><b>Kan Qopheesse:</b> <a href="#about">Fufa Basha Hordofa</a></p><h3>Kitaabilee</h3><ul>';
 BOOKS.forEach(function(b){h+='<li><b>'+b.title+'</b> — '+(b.author||'')+'</li>'});
 return h+'</ul><p class="ref">Mul 22:20 — "Dafeen dhufa, Ameen Gooftaa Yesuus dafii koottu!"</p>'}
function route(){
 var id=(location.hash||'#home').slice(1),a=document.getElementById('app'),t='Afaan Oromoo Bible Study',h;
 var p=id.split('/');
 if(id==='home')h=home();
 else if(id==='search'){h=search();t='Barbaadi'}
 else if(id==='marks'){h=marks();t='Mallattoo'}
 else if(id==='about'){h=about();t='Waa\'ee Barreessaa'}
 else if(id==='credits'){h=credits();t='Waa\'ee Appii'}
 else if(p[0]==='b'&&p.length===2){h=bookPage(p[1]);var b=getBook(p[1]);t=b?b.title:t}
 else if(p[0]==='b'&&p.length===3){h=chap(p[1],p[2]);var b2=getBook(p[1]);t=b2?b2.title:t}
 else h=home();
 a.innerHTML=h+'<div class="cred">Fufa Basha Hordofa · 2026</div>';
 document.getElementById('ttl').textContent=t;
 document.getElementById('back').style.display=id==='home'?'none':'inline';
 window.scrollTo(0,0)}
window.addEventListener('hashchange',route);apply();route();
</script></body></html>
